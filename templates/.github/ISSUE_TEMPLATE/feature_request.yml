name: Feature request
description: Suggest a capability the project does not have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >-
        Describe the situation you are in, not the solution you have in mind. The most
        useful requests explain the need well enough that a better solution can be found.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen, if you have something specific in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried, and why they fall short.

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would be a breaking change
