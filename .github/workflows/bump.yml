name: Bump

# Shared conventional-commit version bump: cocogitto determines the version, writes the
# CHANGELOG and Cargo.toml, and the result is pushed as a GitHub-*signed* commit plus a
# version tag.
#
# This is the union of the two repos' copies plus the fixes neither had (PLAN.md §10
# gotcha 2 — migrate fixes as you extract, or you freeze one repo's regression):
#
#   * ops's least-privilege `repositories:` token scoping (SEC-18 / TASK-1654), which
#     oxydraw's copy omitted — its bump minted a token for every repo in the installation.
#   * oxydraw's App-bot attribution, which ops's copy lacked — ops still committed as
#     `github-actions[bot]`.
#   * NEW: `--skip-ci`, closing TASK-1659. cog.toml's `skip_ci` only *defines* the marker;
#     it is applied only when `cog bump` is passed `--skip-ci`, which no existing workflow
#     did — so every bump commit re-ran the full CI + Bump cycle.
#   * NEW: signed commits via GraphQL (PLAN.md §6). Neither repo produced a Verified badge.

on:
  workflow_call:
    inputs:
      branch:
        description: >-
          Branch to bump. Callers triggered by `workflow_run` should pass the
          `github.event.workflow_run.head_branch` of the run that succeeded.
        type: string
        required: false
        default: main
      signed:
        description: >-
          Push the bump as a GitHub-signed commit via GraphQL `createCommitOnBranch`
          instead of `git push`. Requires cog.toml to have NO `git push` post_bump_hooks
          (this workflow verifies that and fails loudly if it finds them).
        type: boolean
        required: false
        default: true
      skip-ci:
        description: Pass `--skip-ci` to `cog bump`, so the bump commit does not re-trigger CI.
        type: boolean
        required: false
        default: true
      release-workflow:
        description: >-
          Workflow file to dispatch once the version tag exists, e.g. `release.yml`. It
          must accept a `workflow_dispatch` input named `tag`, which is what dist
          generates under `dispatch-releases = true`.

          Empty (the default) dispatches nothing — correct for consumers whose release
          is triggered by the tag push itself. Set it when `skip-ci` is on and the
          release is tag-triggered, because those two cannot coexist: GitHub applies
          `[skip ci]` per push event, a tag push is a push event, so the bump commit's
          marker suppresses the release as well as CI.
        type: string
        required: false
        default: ""
      owner:
        description: Repository owner, used for App token scoping.
        type: string
        required: false
        default: rsvalerio
      app-client-id:
        description: >-
          GitHub App client id. Defaults to the caller's `vars.GH_APP_CLIENT_ID`; pass
          explicitly if the variable is not visible to this workflow.
        type: string
        required: false
        default: ""
      forge-ref:
        description: >-
          Ref of rsvalerio/forge to load composite actions from. Real consumers leave this
          at the default; forge-testbed passes `main` so breakage surfaces there first
          (PLAN.md §7.4).
        type: string
        required: false
        default: v1
      major-tag:
        description: >-
          Moving major tag to repoint at each release, e.g. `v1`. Empty (the default)
          leaves it alone — correct for consumers that do not publish one. forge itself
          passes `v1`, which is what stops the tag its consumers pin from falling behind
          a release again (that drift is what made `ops` pin an exact tag for a while).
        type: string
        required: false
        default: ""
      notify-on-failure:
        description: >-
          On failure, open an issue in this repository (or comment on the one already
          open) naming the step that failed and linking the run.

          On by default, because a failing bump is otherwise invisible: it triggers on
          `workflow_run`, so it runs on no pull request and can be a required check on
          none — nothing red appears in front of any change, and the only symptom is a
          release that never happens. Turn it off in consumers that already watch their
          Actions. Requires the App to hold `issues: write`.
        type: boolean
        required: false
        default: true
      notify-label:
        description: >-
          Label the failure issue carries. It is also how the issue is found again, so
          the workflow comments on one open issue rather than opening a new one per
          failed run, and closes it on the next successful bump. Created if missing.
        type: string
        required: false
        default: bump-failure
      working-directory:
        description: Directory to run `cog` in.
        type: string
        required: false
        default: "."
      install-tools:
        description: >-
          Tools to install, through forge's actions/setup-tools: each name is installed at
          the version forge's mise.toml pins (both defaults are pinned there), and a tool
          forge does not pin must be given as `name@version` (a mise tool name).
        type: string
        required: false
        default: cargo-edit,cocogitto
      rust-toolchain:
        description: >-
          Rust toolchain installed before `install-tools`, so `cargo` is on PATH. Both
          default tools need it: mise compiles `cargo-edit` with `cargo install` (it has no
          release binaries), and a Rust consumer's cog `pre_bump_hooks` run
          `cargo set-version`. ubuntu-latest ships cargo on PATH and hides its absence; a
          self-hosted runner whose job PATH lacks `~/.cargo/bin` fails the install in
          milliseconds. Empty skips it, for a consumer whose tools and hooks need no Rust.
        type: string
        required: false
        default: stable
      runs-on:
        description: >-
          Runner label. The publish workflows default to ubuntu-22.04 instead; see
          docs/versioning.md for why the two are not aligned.
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      GH_APP_PRIVATE_KEY:
        description: Private key of the GitHub App used to mint the bump token.
        required: true
    outputs:
      version:
        description: The version cocogitto bumped to, empty if nothing to release.
        value: ${{ jobs.bump.outputs.version }}
      tag:
        description: The tag created, empty if nothing to release.
        value: ${{ jobs.bump.outputs.tag }}
      commit:
        description: SHA of the pushed bump commit.
        value: ${{ jobs.bump.outputs.commit }}

permissions:
  contents: read

jobs:
  bump:
    name: Bump
    runs-on: ${{ inputs.runs-on }}
    outputs:
      version: ${{ steps.cog.outputs.version }}
      tag: ${{ steps.cog.outputs.tag }}
      commit: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Composite actions referenced by a *reusable* workflow with a `./` path resolve
      # against the CALLER's workspace, not forge's. So forge is checked out into the
      # workspace and used from there. The path is static (`uses:` cannot take an
      # expression) but the ref is not, which is what lets the testbed float on main.
      # This must come AFTER the checkout above, which cleans the workspace root.
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false

      - name: Keep forge out of the bump commit
        run: echo '/.forge/' >>.git/info/exclude

      - name: Mint bump token (GitHub App)
        id: app-token
        uses: ./.forge/actions/mint-app-token
        with:
          client-id: ${{ inputs.app-client-id || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          # Least privilege: this job only ever writes to the repository being bumped.
          repositories: ${{ github.event.repository.name }}

      - name: Configure App bot identity
        uses: ./.forge/actions/app-bot-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      # Before setup-tools: its `cargo:` installs and the caller's cog hooks both call cargo.
      # `cache: false` and `build-warnings: ""` for the reasons in rust-ci.yml's header.
      - name: Install Rust ${{ inputs.rust-toolchain }}
        if: inputs.rust-toolchain != ''
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          build-warnings: ""
          cache: false

      # At the versions forge's mise.toml pins, the one list every forge workflow installs
      # from, so a bump never runs a cocogitto or cargo-edit that changed since the last one.
      # setup-tools reads only forge's mise.toml, never this repository's.
      - name: Install ${{ inputs.install-tools }}
        uses: ./.forge/actions/setup-tools
        with:
          tools: ${{ inputs.install-tools }}

      # In signed mode the commit is created through the API, so a `git push` post_bump_hook
      # would race it: cog would push the UNSIGNED commit first, leaving the branch ahead of
      # `expectedHeadOid` and the GraphQL mutation would fail with a confusing conflict.
      # Catch the misconfiguration here, where the message can explain it.
      - name: Verify cog.toml is compatible with signed mode
        if: inputs.signed
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ ! -f cog.toml ]; then
            echo "::error::bump: no cog.toml in $(pwd)." >&2
            exit 1
          fi
          if grep -qE '^\s*"git push' cog.toml; then
            echo "::error::bump: cog.toml still has \`git push\` post_bump_hooks, which are" \
                 "incompatible with signed mode. This workflow pushes the commit and the tag" \
                 "itself via the API. Remove the push hooks, or call with \`signed: false\`." >&2
            exit 1
          fi

      - name: Run cog bump --auto
        id: cog
        working-directory: ${{ inputs.working-directory }}
        env:
          SKIP_CI: ${{ inputs.skip-ci }}
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"

          args=(--auto)
          [ "$SKIP_CI" = "true" ] && args+=(--skip-ci)

          # cog exits non-zero when there is nothing to release; that is a no-op, not a
          # failure, so distinguish it by whether HEAD actually moved.
          set +e
          cog -vvv bump "${args[@]}"
          status=$?
          set -e

          after="$(git rev-parse HEAD)"
          if [ "$before" = "$after" ]; then
            echo "no version bump produced (cog exit $status); nothing to release"
            echo "bumped=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::bump: cog bump moved HEAD but exited $status." >&2
            exit "$status"
          fi

          tag="$(git tag --points-at HEAD | head -n1)"
          if [ -z "$tag" ]; then
            echo "::error::bump: cog created a commit but no tag points at it." >&2
            exit 1
          fi

          {
            echo "bumped=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "base=$before"
          } >>"$GITHUB_OUTPUT"
          echo "bumped to $tag"

      # Replay the local bump commit through GraphQL so GitHub builds — and signs — the
      # commit object. Author comes from the App token; committer is GitHub itself. The
      # action asserts verified=true, so a silent regression to unsigned fails the release.
      - name: Push the bump as a signed commit
        id: signed
        if: steps.cog.outputs.bumped == 'true' && inputs.signed
        uses: ./.forge/actions/signed-commit
        with:
          branch: ${{ inputs.branch }}
          base: ${{ steps.cog.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}

      # createCommitOnBranch only creates commits, so the tag is a separate ref pointing at
      # the signed commit. The tag ref itself is unsigned — normal, invisible in the UI, and
      # it still triggers the tag-driven release workflow.
      - name: Create the version tag
        if: steps.cog.outputs.bumped == 'true' && inputs.signed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.cog.outputs.tag }}
          SHA: ${{ steps.signed.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "/repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null
          echo "tagged ${TAG} at ${SHA}"

      # Keep the moving major tag level with the release just cut. Doing this by hand is
      # what let `v1` sit on v0.1.2 while v0.2.0 shipped: consumers pinning `@v1` — the
      # convention versioning.md tells them to use — silently ran the older workflow, and
      # `ops` worked around it with an exact pin. An unpinned consumer is only safe if the
      # tag it pins moves on its own.
      #
      # move-major-tag owns both the guard (never carry the tag UP across a major) and the
      # lightweight-ref repoint; forge's own release.yml runs the same action, so a fix to
      # either reaches both.
      - name: Repoint the moving major tag
        id: major
        if: steps.cog.outputs.bumped == 'true' && inputs.signed && inputs.major-tag != ''
        uses: ./.forge/actions/move-major-tag
        with:
          version: ${{ steps.cog.outputs.tag }}
          major-tag: ${{ inputs.major-tag }}
          sha: ${{ steps.signed.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      # Ask for the release explicitly, because the tag push cannot. `--ref` is the
      # branch rather than the tag: the branch always carries the newest workflow file,
      # whereas dispatching against a tag whose release.yml predates `dispatch-releases`
      # fails with "workflow does not have workflow_dispatch trigger". The `tag` input is
      # what selects the code to build, and dist errors loudly if it disagrees with the
      # version in the tree — so the branch having moved on shows up as a failure rather
      # than a wrong release.
      - name: Dispatch the release workflow
        if: steps.cog.outputs.bumped == 'true' && inputs.signed && inputs.release-workflow != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ inputs.release-workflow }}
          BRANCH: ${{ inputs.branch }}
          TAG: ${{ steps.cog.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run "$WORKFLOW" --repo "$REPOSITORY" --ref "$BRANCH" -f "tag=$TAG"
          echo "dispatched $WORKFLOW for $TAG" >>"$GITHUB_STEP_SUMMARY"

      - name: Push the bump unsigned
        id: unsigned
        if: steps.cog.outputs.bumped == 'true' && !inputs.signed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          TAG: ${{ steps.cog.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Summarise
        id: push
        if: steps.cog.outputs.bumped == 'true'
        env:
          TAG: ${{ steps.cog.outputs.tag }}
          SIGNED: ${{ inputs.signed }}
          SHA: ${{ steps.signed.outputs.sha || steps.unsigned.outputs.sha }}
          MAJOR: ${{ inputs.major-tag }}
          MOVED: ${{ steps.major.outputs.move }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          {
            echo "### Bumped \`${TAG}\`"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- signed: \`${SIGNED}\`"
            # Empty when the repoint step did not run (no major-tag, or unsigned).
            case "$MOVED" in
              true) echo "- moving tag: \`${MAJOR}\` -> \`${SHA}\`" ;;
              false) echo "- moving tag: left in place (\`${TAG}\` is past \`${MAJOR}\`)" ;;
            esac
          } >>"$GITHUB_STEP_SUMMARY"

      # A bump that got this far is healthy, including the no-op one where there was
      # nothing to release — so retire the issue the notify job opens. Done here, in the
      # job that already holds a token, rather than as a second job: this is one list call
      # on every push to the default branch, and a job would mean another checkout and
      # another token mint for it.
      #
      # Never fail the release over this. The App may hold no `issues: write` grant, which
      # is a notification problem and not a reason to redden a bump that worked.
      - name: Close any open bump-failure issue
        if: inputs.notify-on-failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ inputs.notify-label }}
          BRANCH: ${{ inputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The label is not an identity. It says nothing about which branch the issue is
          # for, and anyone can put it on an unrelated issue — either way this step would
          # close something it does not own. Match the marker the notify job writes into
          # the body instead, and leave the label as what it is useful for: keeping the
          # listing small, and giving humans something to search on.
          marker="<!-- forge:bump-failure branch=${BRANCH} -->"
          # --limit, because the default page is 30 and the marked issue may be the 31st.
          if ! issues="$(gh issue list --label "$LABEL" --state open --limit 100 \
                           --json number,body)"; then
            echo "::warning::bump: could not list '$LABEL' issues; leaving any open one" \
                 "alone. Grant the App 'Issues: Write', or set notify-on-failure: false."
            exit 0
          fi
          # jq through a pipe rather than gh's --jq: only this form takes --arg, and a
          # branch name interpolated straight into a jq program is a quoting accident
          # waiting to happen.
          # shellcheck disable=SC2016  # `$m` is jq's argument, not the shell's
          ours="$(printf '%s' "$issues" |
                    jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | .number')"
          while read -r n; do
            [ -n "$n" ] || continue
            gh issue close "$n" --reason completed \
              --comment "Bump succeeded again in [this run](${RUN_URL}). Closing."
            echo "closed #$n"
          done <<<"$ours"

  # Report a failed bump somewhere a human will see it. Bump triggers on `workflow_run`
  # after CI on the default branch: it runs on no pull request and can be a required check
  # on none, so nothing red ever appears in front of a change and the only symptom is a
  # release that silently stops happening. `dbsec` lost nine days and 293 commits that way.
  #
  # GitHub's own failure email goes to the actor and did not help there, so this reports to
  # something that stays put: one issue in the repository, reused across consecutive
  # failures and closed by the next success. Opt out with `notify-on-failure: false`.
  notify:
    name: Report bump failure
    needs: bump
    # `failure()` and not `always()`: a cancelled run is somebody's decision, not a fault.
    if: failure() && inputs.notify-on-failure
    runs-on: ${{ inputs.runs-on }}
    steps:
      # Only forge is checked out — this job touches the API, never the tree.
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false

      # A fresh token: the bump job's may itself be what failed to mint, and a job output
      # cannot carry a secret anyway.
      - name: Mint notification token (GitHub App)
        id: app-token
        uses: ./.forge/actions/mint-app-token
        with:
          client-id: ${{ inputs.app-client-id || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ inputs.notify-label }}
          BRANCH: ${{ inputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS: https://github.com/rsvalerio/forge/blob/main/docs/consuming.md#prerequisites
        run: |
          set -euo pipefail

          # Name the step, not just the run. Which step failed is the whole diagnosis: a
          # failure at `Push the bump as a signed commit` is the ruleset-bypass gap
          # consuming.md describes, and reads nothing like a failure at `Run cog bump`.
          # shellcheck disable=SC2016  # `$j` is jq's variable, not the shell's
          failed="$(
            gh api "/repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | . as $j
                    | $j.steps[] | select(.conclusion == "failure")
                    | "- `\($j.name)` -> `\(.name)`"' \
            || true
          )"
          [ -n "$failed" ] || failed="- (the run's steps could not be read)"

          # How both this job and the close-on-success step recognise an issue as theirs,
          # and as this branch's. An HTML comment, so it is invisible once rendered.
          marker="<!-- forge:bump-failure branch=${BRANCH} -->"

          # printf rather than a heredoc, so the issue body's markdown code spans stay
          # literal: an unquoted heredoc would run every backtick as a command, and a
          # quoted one would stop `$BRANCH` and the rest from interpolating.
          # shellcheck disable=SC2016  # the backticks below are markdown, not substitution
          {
            printf '`Bump` failed on `%s`, so **nothing was released**.\n\n' "$BRANCH"
            printf 'Failed step:\n\n%s\n\n' "$failed"
            printf 'Run: %s\n\n---\n\n' "$RUN_URL"
            printf 'Nothing else will surface this. `Bump` triggers on `workflow_run` after\n'
            printf 'CI, so it runs on no pull request and can be a required check on none —\n'
            printf 'the branch keeps merging green while the version stays where it is.\n\n'
            printf 'Worth checking, in this order:\n\n'
            printf -- '- **`Push the bump as a signed commit`, with `Repository rule violations'
            printf    ' found`** — the App is not in the bypass list of a ruleset on `%s`.' "$BRANCH"
            printf    ' See [consuming.md](%s).\n' "$DOCS"
            printf -- '- **`Verify cog.toml is compatible with signed mode`** — `cog.toml`'
            printf    ' still has `git push` post_bump_hooks; remove them, or pass'
            printf    ' `signed: false`.\n'
            printf -- '- **`Mint bump token`** — `GH_APP_PRIVATE_KEY` or'
            printf    ' `vars.GH_APP_CLIENT_ID` is unset, or not visible to this workflow.\n\n'
            printf 'This issue is reused for further failures and closed by the next\n'
            printf 'successful bump. Silence it with `notify-on-failure: false`.\n'
            printf '\n%s\n' "$marker"
          } >"${RUNNER_TEMP}/bump-failure.md"

          # One issue, not one per failed run — and specifically the one this workflow
          # opened for this branch. The label narrows the listing; the marker is what
          # establishes ownership, so a second branch gets its own issue and an issue
          # somebody labelled by hand is left alone.
          existing=""
          if issues="$(gh issue list --label "$LABEL" --state open --limit 100 \
                         --json number,body)"; then
            # shellcheck disable=SC2016  # `$m` is jq's argument, not the shell's
            existing="$(printf '%s' "$issues" |
                          jq -r --arg m "$marker" \
                            '[.[] | select(.body | contains($m)) | .number] | .[0] // empty')"
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "${RUNNER_TEMP}/bump-failure.md"
            echo "commented on #$existing" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `gh issue create --label` rejects a label the repository does not have, and a
          # consumer adopting this has never had one. Creating it is idempotent enough to
          # ignore the second time.
          gh label create "$LABEL" --color B60205 \
            --description "A Bump run failed and no release was cut" >/dev/null 2>&1 || true

          if ! url="$(gh issue create \
                        --title "Bump failed on ${BRANCH} — no release was cut" \
                        --label "$LABEL" \
                        --body-file "${RUNNER_TEMP}/bump-failure.md")"; then
            echo "::error::bump: could not open the failure issue. Grant the App" \
                 "'Issues: Write' on this repository, or pass notify-on-failure: false." >&2
            exit 1
          fi
          echo "opened $url" >>"$GITHUB_STEP_SUMMARY"
