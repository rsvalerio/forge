name: Test self

# forge's own CI. A shared repo means one bad commit can break every consumer's release
# pipeline at once (PLAN.md §8), so the machinery is linted and the actions are actually
# exercised before a tag is cut.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs actionlint, shellcheck and yq at the versions mise.toml pins — the same
      # file `ops verify` reads — so CI and the local gate lint with identical tools
      # instead of whatever the runner image ships. `version` pins mise itself; Dependabot
      # moves the SHA below but not `version`, so bump it with mise.toml (README "Layout").
      - name: Install pinned tools (mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      # actionlint understands workflow syntax, expression contexts and `uses:` refs, and
      # runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      # The remaining checks live in ci/lint.sh so `ops verify` runs them verbatim; add a
      # check there and list it both here and in .ops.toml.
      - name: shellcheck standalone scripts
        run: ci/lint.sh shellcheck

      - name: Every script is executable
        run: ci/lint.sh executable

      - name: Every action directory has a well-formed action.yml
        run: ci/lint.sh action-yml

      - name: Shared configs parse as TOML
        run: ci/lint.sh config-toml

      - name: Third-party actions are SHA-pinned
        run: ci/lint.sh pinned-actions

  # rust-ci.yml is the most-consumed workflow, and a toolchain-action default can change
  # what it fails on without any edit here (setup-rust-toolchain v2's
  # CARGO_BUILD_WARNINGS=deny merged green in #16). Two tiny fixture crates under
  # ci/fixtures/rust-ci pin the warnings policy: a warning-free crate must pass under the
  # default `clippy-args: -D warnings`, and a crate with one deliberate rustc warning must
  # pass every job once the caller drops `-D warnings`, because clippy-args is the only
  # place that policy lives. The two calls also cover both caching modes. cargo-deny is
  # off: the fixtures have no dependencies to vet.
  rust-ci-clean:
    name: rust-ci on a warning-free crate
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: ci/fixtures/rust-ci/clean
      run-deny: false

  rust-ci-warning:
    name: rust-ci on a crate with a warning
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: ci/fixtures/rust-ci/warning
      clippy-args: ""
      run-deny: false
      use-sccache: false

  # The pool commit is where a mistake costs most: retention deletes published packages,
  # so the pruning rules are tested against a local stand-in for the apt repository.
  apt-pool-push:
    name: apt-pool-push pool logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pool-update.sh
        run: actions/apt-pool-push/pool-update.test.sh

  # Repackages a real, pinned ops release, so the tarball layout and .sha256 format are
  # dist's actual output rather than a fixture's idea of it.
  deb-from-dist:
    name: deb-from-dist against an ops release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package ops v0.65.0
        id: deb
        uses: ./actions/deb-from-dist
        with:
          tag: v0.65.0
          repository: rsvalerio/ops
          app: ops
          description: |
            Batteries-included task runner
            forge test-self build; not published.
          maintainer: forge test-self <noreply@example.invalid>
          homepage: https://github.com/rsvalerio/ops

      - name: One .deb per linux-gnu target, and it installs
        env:
          DEBS: ${{ steps.deb.outputs.debs }}
          VERSION: ${{ steps.deb.outputs.version }}
        run: |
          set -euo pipefail
          [ "$VERSION" = "0.65.0" ] || { echo "::error::version output is '$VERSION'"; exit 1; }
          mapfile -t debs <<<"$DEBS"
          [ "${#debs[@]}" = 2 ] || { echo "::error::expected 2 .debs, got ${#debs[@]}"; exit 1; }
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          amd64="$(grep '_amd64\.deb$' <<<"$DEBS")"
          grep -q '_arm64\.deb$' <<<"$DEBS" || { echo "::error::no arm64 .deb"; exit 1; }
          sudo apt-get install -y "$amd64"
          ops --version

      - name: The output feeds apt-pool-push unchanged
        env:
          DEBS: ${{ steps.deb.outputs.debs }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git init -q --bare "$work/remote.git"
          git clone -q "$work/remote.git" "$work/apt"
          git -C "$work/apt" config user.name test
          git -C "$work/apt" config user.email test@example.invalid
          POOL=pool PACKAGE=ops VERSION=0.65.0 APT_DIR="$work/apt" \
            actions/apt-pool-push/pool-update.sh
          [ "$(git -C "$work/remote.git" rev-list --count HEAD)" = 1 ] \
            || { echo "::error::expected a single pool commit"; exit 1; }
          [ "$(git -C "$work/remote.git" ls-tree --name-only HEAD:pool | wc -l)" = 2 ] \
            || { echo "::error::expected both .debs in the pool"; exit 1; }

      - name: An unmappable target is rejected
        id: unmappable
        continue-on-error: true
        uses: ./actions/deb-from-dist
        with:
          tag: v0.65.0
          repository: rsvalerio/ops
          app: ops
          targets: aarch64-apple-darwin
          description: never built
          maintainer: forge test-self <noreply@example.invalid>
          output-dir: ${{ runner.temp }}/unmappable

      - name: Assert the unmappable target failed the step
        if: steps.unmappable.outcome != 'failure'
        run: |
          echo "::error::deb-from-dist accepted aarch64-apple-darwin"
          exit 1

  # Proves the claim the whole verified-bump design rests on: that GraphQL
  # createCommitOnBranch — and only it — yields verified=true. Runs against a throwaway
  # branch in this repository, and always deletes it.
  signed-commit:
    name: signed-commit integration
    runs-on: ubuntu-latest
    # Needs GH_APP_PRIVATE_KEY, which neither fork PRs nor Dependabot PRs receive:
    # Dependabot-triggered runs only see Dependabot secrets. Skipping (rather than giving
    # Dependabot the key) keeps the App key away from freshly bumped, unreviewed action
    # code; the bump is still exercised here on the push to main after merge. Matched on
    # the PR author, not github.actor, so a human re-run of a Dependabot PR still skips.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint own-repo token
        id: app-token
        uses: ./actions/mint-app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Configure App bot identity
        id: identity
        uses: ./actions/app-bot-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}

      - name: Create a scratch branch and a local commit
        id: scratch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="ci/signed-commit-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="$(git rev-parse HEAD)"
          gh api "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${base}" >/dev/null

          # Exercise all three file-change kinds the action claims to support:
          # add, modify, delete.
          mkdir -p .probe
          echo "added at ${GITHUB_RUN_ID}" >.probe/added.txt   # add
          echo "modified at ${GITHUB_RUN_ID}" >>README.md      # modify
          git rm -q actions/signed-commit/testdata/deleteme.txt # delete
          git add -A .probe README.md
          git commit -q -m "test: signed-commit probe" -m "Body line preserved."

          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "base=$base" >>"$GITHUB_OUTPUT"

      - name: Replay it as a signed commit
        id: signed
        uses: ./actions/signed-commit
        with:
          branch: ${{ steps.scratch.outputs.branch }}
          base: ${{ steps.scratch.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Assert signature, author and message
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.signed.outputs.sha }}
          EXPECTED_AUTHOR: ${{ steps.identity.outputs.name }}
        run: |
          set -euo pipefail
          commit="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${SHA}")"

          verified="$(jq -r .commit.verification.verified <<<"$commit")"
          author="$(jq -r .author.login <<<"$commit")"
          headline="$(jq -r '.commit.message | split("\n")[0]' <<<"$commit")"
          body="$(jq -r .commit.message <<<"$commit")"

          echo "verified=$verified author=$author headline=$headline"

          [ "$verified" = "true" ] || { echo "::error::commit is not verified"; exit 1; }
          [ "$author" = "$EXPECTED_AUTHOR" ] \
            || { echo "::error::author is '$author', expected '$EXPECTED_AUTHOR'"; exit 1; }
          [ "$headline" = "test: signed-commit probe" ] \
            || { echo "::error::headline not preserved: '$headline'"; exit 1; }
          grep -q "Body line preserved." <<<"$body" \
            || { echo "::error::body not preserved"; exit 1; }

          # The signing identity is GitHub itself; that is what makes the badge appear.
          [ "$(jq -r .commit.committer.name <<<"$commit")" = "GitHub" ] \
            || echo "::warning::committer is not 'GitHub' — signing behaviour may have changed"

          # The delete path is the one most easily broken without noticing, since a
          # commit with only additions still looks correct.
          files="$(jq -r '.files[] | "\(.status) \(.filename)"' <<<"$commit")"
          echo "$files"
          grep -q "^added .probe/added.txt$" <<<"$files" \
            || { echo "::error::addition not applied"; exit 1; }
          grep -q "^modified README.md$" <<<"$files" \
            || { echo "::error::modification not applied"; exit 1; }
          grep -q "^removed actions/signed-commit/testdata/deleteme.txt$" <<<"$files" \
            || { echo "::error::deletion not applied"; exit 1; }

      - name: Delete the scratch branch
        if: always() && steps.scratch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.scratch.outputs.branch }}
        run: |
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            >/dev/null 2>&1 || echo "scratch branch already gone"
