name: Publish .deb

# Shared implementation behind oxydraw's (and later my-cloud's) publish-deb.yml. Builds
# nothing itself — the consumer's build command produces the .deb, and
# actions/apt-pool-push owns the part that is identical everywhere: minting an apt-scoped
# token, attributing the commit to the App bot, and dropping the package into the apt
# repo's pool.
#
# Extracted from oxydraw/.github/workflows/publish-deb.yml, with the hardcoded
# `rsvalerio/apt` destination replaced by an override so the testbed can exercise this
# path (PLAN.md §7.3 / gotcha 7).

on:
  workflow_call:
    inputs:
      package-name:
        description: Package name, used in the pool commit message.
        type: string
        required: true
      build-command:
        description: Command that builds the .deb.
        type: string
        required: false
        default: make build
      deb-path-command:
        description: >-
          Command printing the path of the built .deb, relative to the repository root.
        type: string
        required: false
        default: make --no-print-directory -C packaging deb-path
      working-directory:
        description: Directory to run `build-command` in.
        type: string
        required: false
        default: packaging
      apt-repository:
        description: APT repository to publish into, as `owner/name`.
        type: string
        required: false
        default: rsvalerio/apt
      pool-path:
        description: Path within the apt repository to drop the .deb into.
        type: string
        required: false
        default: pool
      version:
        description: Version label for the pool commit message. Defaults to the tag name.
        type: string
        required: false
        default: ""
      dry-run:
        description: Build and stage the .deb, then stop before committing or pushing.
        type: boolean
        required: false
        default: false
      owner:
        description: Owner of the apt repository, used for App token scoping.
        type: string
        required: false
        default: rsvalerio
      app-client-id:
        description: >-
          GitHub App client id. Defaults to the caller's `vars.GH_APP_CLIENT_ID`; pass
          explicitly if the variable is not visible to this workflow.
        type: string
        required: false
        default: ""
      forge-ref:
        description: >-
          Ref of rsvalerio/forge to load composite actions from. Real consumers leave this
          at the default; forge-testbed passes `main` (docs/versioning.md).
        type: string
        required: false
        default: v1
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-22.04, not ubuntu-latest like bump and
          publish-crates; docs/versioning.md says why the two are not aligned.
        type: string
        required: false
        default: ubuntu-22.04
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish-deb:
    name: Publish .deb
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one way a reusable workflow reaches forge's composite actions; the same step
      # in every such workflow. Why it is a checkout and not a `uses:`, and why it cannot
      # be factored out: docs/versioning.md.
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false

      - name: Build .deb
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Locate the built .deb
        id: deb
        run: |
          set -euo pipefail
          deb="$(${{ inputs.deb-path-command }})"
          if [ ! -f "$deb" ]; then
            echo "::error::publish-deb: expected artifact not found: $deb" >&2
            ls -la "$(dirname "$deb")" >&2 || true
            exit 1
          fi
          echo "path=$deb" >>"$GITHUB_OUTPUT"

      # No `keep-versions` here, so apt-pool-push's default of 0 applies and every version
      # stays in the pool. publish-deb-dist defaults to 3; see docs/consuming.md,
      # "Retention", and docs/versioning.md for why the two are not aligned.
      - name: Publish to the apt pool
        uses: ./.forge/actions/apt-pool-push
        with:
          debs: ${{ steps.deb.outputs.path }}
          package-name: ${{ inputs.package-name }}
          version: ${{ inputs.version || github.ref_name }}
          apt-repository: ${{ inputs.apt-repository }}
          pool-path: ${{ inputs.pool-path }}
          dry-run: ${{ inputs.dry-run }}
          owner: ${{ inputs.owner }}
          app-client-id: ${{ inputs.app-client-id || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
