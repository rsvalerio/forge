name: Publish .deb

# Shared implementation behind oxydraw's (and later my-cloud's) publish-deb.yml. Builds
# nothing itself — the consumer's build command produces the .deb, and this workflow owns
# the part that is identical everywhere: minting an apt-scoped token, attributing the
# commit to the App bot, and dropping the package into the apt repo's pool.
#
# Extracted from oxydraw/.github/workflows/publish-deb.yml, with the hardcoded
# `rsvalerio/apt` destination replaced by an override so the testbed can exercise this
# path (PLAN.md §7.3 / gotcha 7).

on:
  workflow_call:
    inputs:
      package-name:
        description: Package name, used in the pool commit message.
        type: string
        required: true
      build-command:
        description: Command that builds the .deb.
        type: string
        required: false
        default: make build
      deb-path-command:
        description: >-
          Command printing the path of the built .deb, relative to the repository root.
        type: string
        required: false
        default: make --no-print-directory -C packaging deb-path
      working-directory:
        description: Directory to run `build-command` in.
        type: string
        required: false
        default: packaging
      apt-repository:
        description: APT repository to publish into, as `owner/name`.
        type: string
        required: false
        default: rsvalerio/apt
      pool-path:
        description: Path within the apt repository to drop the .deb into.
        type: string
        required: false
        default: pool
      version:
        description: Version label for the pool commit message. Defaults to the tag name.
        type: string
        required: false
        default: ""
      dry-run:
        description: Build and stage the .deb, then stop before committing or pushing.
        type: boolean
        required: false
        default: false
      owner:
        type: string
        required: false
        default: rsvalerio
      app-client-id:
        type: string
        required: false
        default: ""
      forge-ref:
        type: string
        required: false
        default: v1
      runs-on:
        type: string
        required: false
        default: ubuntu-22.04
    secrets:
      GH_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish-deb:
    name: Publish .deb
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out forge
        uses: actions/checkout@v6
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false

      - name: Build .deb
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Locate the built .deb
        id: deb
        run: |
          set -euo pipefail
          deb="$(${{ inputs.deb-path-command }})"
          if [ ! -f "$deb" ]; then
            echo "::error::publish-deb: expected artifact not found: $deb" >&2
            ls -la "$(dirname "$deb")" >&2 || true
            exit 1
          fi
          echo "path=$deb" >>"$GITHUB_OUTPUT"
          echo "file=$(basename "$deb")" >>"$GITHUB_OUTPUT"

      - name: Derive apt repository name
        id: apt
        env:
          APT: ${{ inputs.apt-repository }}
        run: echo "name=${APT#*/}" >>"$GITHUB_OUTPUT"

      - name: Mint apt-scoped token (GitHub App)
        id: apt-token
        uses: ./.forge/actions/mint-app-token
        with:
          client-id: ${{ inputs.app-client-id || vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          # GITHUB_TOKEN cannot push cross-repo; this is the only way in.
          repositories: ${{ steps.apt.outputs.name }}

      - name: Check out the apt repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.apt-repository }}
          token: ${{ steps.apt-token.outputs.token }}
          persist-credentials: true
          path: .apt

      - name: Configure App bot identity
        uses: ./.forge/actions/app-bot-identity
        with:
          token: ${{ steps.apt-token.outputs.token }}
          app-slug: ${{ steps.apt-token.outputs.app-slug }}
          working-directory: .apt

      - name: Publish to the apt pool
        env:
          DEB: ${{ steps.deb.outputs.path }}
          DEB_FILE: ${{ steps.deb.outputs.file }}
          POOL: ${{ inputs.pool-path }}
          PACKAGE: ${{ inputs.package-name }}
          VERSION: ${{ inputs.version || github.ref_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          mkdir -p ".apt/${POOL}"
          cp "$DEB" ".apt/${POOL}/"
          cd .apt
          git add "${POOL}/${DEB_FILE}"

          if git diff --cached --quiet; then
            echo "No changes to publish (package already present)."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry-run: ${DEB_FILE} staged in ${POOL}/, not committed or pushed."
            git --no-pager diff --cached --stat
            exit 0
          fi

          git commit -m "${PACKAGE}: add ${VERSION}"
          git push origin HEAD
