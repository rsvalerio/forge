name: Rust CI

# Shared Rust gates, run through ops (docs/consuming.md, "rust-ci"): `ops verify-check`,
# `ops next` + `ops test-doc`, `ops deps --check` and `ops sec`, so CI runs the commands
# a developer runs, with the flags from the ops Rust stack plus the caller's `.ops.toml`.
# Every job shares one setup, actions/setup-rust. `run-msrv` adds an MSRV job.
#
# The cargo engine these replaced (six jobs of raw cargo commands tuned through
# `cargo-flags`, `clippy-args` and `test-args`) and the `engine` input that chose between
# them are gone; a repo tunes its CI in `.ops.toml` (docs/versioning.md).
#
# oxydraw's `frontend` job is deliberately NOT here — it is Bun/SPA-specific and has one
# consumer (see PLAN.md open question 4). It stays in oxydraw's own ci.yml.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Cargo workspace. oxydraw uses `backend`.
        type: string
        required: false
        default: "."
      toolchain:
        description: Rust toolchain to install.
        type: string
        required: false
        default: stable
      runs-on:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest
      forge-ref:
        description: >-
          Ref of rsvalerio/forge to load composite actions and tool pins (mise.toml) from.
          Real consumers leave this at the default; SHA-pinning the `uses:` line pins
          only this file, so pass the same SHA here too (docs/versioning.md).
        type: string
        required: false
        default: v1
      env-json:
        description: >-
          JSON object of extra environment variables for the test job, e.g.
          '{"OPS_LOG_LEVEL":"debug"}'.
        type: string
        required: false
        default: "{}"
      run-deny:
        description: >-
          Run `ops deps --check` (cargo-deny and cargo-machete, at forge's mise.toml pins).
        type: boolean
        required: false
        default: true
      run-tests:
        description: Run the test job.
        type: boolean
        required: false
        default: true
      run-sec:
        description: >-
          Run `ops sec` (Trivy secret and vulnerability scans), the security leg of the
          gate contract.
        type: boolean
        required: false
        default: true
      run-msrv:
        description: >-
          Check the workspace on its declared minimum Rust version: `ops msrv --install`
          reads `rust-version` from Cargo.toml, fails unless clippy.toml's `msrv` equals
          it, installs that toolchain and runs
          `cargo check --workspace --all-features --all-targets` on it.
        type: boolean
        required: false
        default: false
      use-sccache:
        description: >-
          Compile through sccache, cached in the Actions cache. Turn it off on a
          runner whose provider accelerates the Actions cache but not sccache's
          own traffic to it -- Blacksmith documents exactly that exception, so a
          job there reaches across to GitHub's cache while every other step uses
          the colocated one. The jobs then cache `target/` with
          `Swatinem/rust-cache` instead, which is an `actions/cache` consumer
          and so is accelerated like the rest.
        type: boolean
        required: false
        default: true

# The ceiling every consumer runs under, as in the other five workflows here. A
# reusable workflow that declares none inherits whatever the caller granted —
# and a caller that declares none in turn inherits the repository default, which
# is how `dbsec` came to run these jobs on a default token. Declared here,
# the cap holds no matter what the caller passes: a called workflow's
# permissions can only narrow the caller's, never widen them.
#
# `contents: read` is the whole need. The jobs below check out (the caller, and
# forge at `forge-ref` for its composite actions), install a toolchain, and pull
# release binaries through actions/setup-tools; sccache and the mise cache reach
# the Actions cache through ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN. Nothing here
# writes or takes a secret.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Empty rather than absent when sccache is off: `RUSTC_WRAPPER: ""` is what
  # the deps and sec jobs use to opt out, and cargo treats an empty value as no
  # wrapper.
  RUSTC_WRAPPER: ${{ inputs.use-sccache && 'sccache' || '' }}
  # Build against the committed Cargo.lock: ops adds `--locked` to every cargo command
  # that resolves it.
  OPS__CARGO__LOCKED: "true"
  # Stated here rather than left to `setup-rust-toolchain`, which exports the same
  # value only when nothing set it first. sccache cannot cache an incremental
  # build, and `target/` caching gains nothing from one either: a CI checkout never
  # recompiles the same crate twice.
  CARGO_INCREMENTAL: "0"
# actions/setup-rust's `setup-rust-toolchain` step passes `cache: false`. The action runs
# `Swatinem/rust-cache` itself unless told not to, so without it every job would pay a
# restore and save of `target/` whatever `use-sccache` said, even in jobs that compile
# nothing, and keyed on the repo root rather than `working-directory`. setup-rust's own
# `compile-cache` is the only `target/` caching these jobs do.
#
# It also passes `build-warnings: ""`. setup-rust-toolchain v2 defaults that input to
# `deny` and exports CARGO_BUILD_WARNINGS=deny, which on cargo 1.97+ turns every rustc
# warning into an error in check, build and test too. An empty value makes the action
# export nothing, so the warnings policy stays with the caller's `.ops.toml`, lints and
# `.cargo/config.toml`.

jobs:
  # Each job: check out, check out forge at `forge-ref` for actions/setup-rust (toolchain,
  # compile cache, and ops plus the job's tools at forge's mise.toml pins), keep that
  # checkout out of the gate, then run one leg of the gate contract. "Out of the gate"
  # is a git exclude where the gate reads only what git tracks (ops's file checks skip what
  # git ignores), and moving the checkout to $RUNNER_TEMP for the gate where it scans the
  # file tree (cargo-deny, machete, Trivy). It is moved back, never deleted: setup-rust's
  # post steps run at job end from `.forge/actions/setup-rust`. What each `ops`
  # command runs is the ops Rust stack's default unless the caller's `.ops.toml`
  # overrides it, so a repo tunes its CI there, not through this workflow's inputs.

  # The static gate: fmt-check, the whitespace and end-of-file checks, clippy
  # (--all-targets, so test code is linted), build, the JSON/YAML parse checks and doc.
  # `verify-check` is `verify` with every rewriter swapped for its check-only twin.
  ops-verify:
    name: ops verify-check
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false
      - uses: ./.forge/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
          compile-cache: ${{ inputs.use-sccache && 'sccache' || 'rust-cache' }}
          working-directory: ${{ inputs.working-directory }}
          tools: ops
      - name: Keep forge out of the gate
        run: echo '/.forge/' >>.git/info/exclude
      - name: ops verify-check
        working-directory: ${{ inputs.working-directory }}
        run: ops verify-check

  # nextest for the tests, `ops test-doc` for the doctests nextest does not run.
  ops-test:
    name: ops test
    if: inputs.run-tests
    runs-on: ${{ inputs.runs-on }}
    env: ${{ fromJSON(inputs.env-json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false
      - uses: ./.forge/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          compile-cache: ${{ inputs.use-sccache && 'sccache' || 'rust-cache' }}
          working-directory: ${{ inputs.working-directory }}
          tools: ops, cargo-nextest
      - name: Keep forge out of the gate
        run: echo '/.forge/' >>.git/info/exclude
      - name: ops next
        working-directory: ${{ inputs.working-directory }}
        run: ops next
      - name: ops test-doc
        working-directory: ${{ inputs.working-directory }}
        run: ops test-doc

  # cargo-deny (advisories, licenses, bans, sources) and cargo-machete (unused
  # dependencies, a warning only: it is heuristic). `--check` is the CI-safe mode: no
  # upgrade survey, so no cargo-edit, and nothing cached between runs.
  ops-deps:
    name: ops deps
    if: inputs.run-deny
    runs-on: ${{ inputs.runs-on }}
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false
      - uses: ./.forge/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          compile-cache: none
          working-directory: ${{ inputs.working-directory }}
          tools: ops, cargo-deny, cargo-machete
      - name: Move the forge checkout out of the gate
        run: mv .forge "$RUNNER_TEMP/forge"
      - name: ops deps --check
        working-directory: ${{ inputs.working-directory }}
        run: ops deps --check
      - name: Restore the forge checkout for setup-rust's post steps
        if: always()
        run: '[ ! -d "$RUNNER_TEMP/forge" ] || mv "$RUNNER_TEMP/forge" .forge'

  # Trivy's secret scan always, and its vulnerability scan wherever a lockfile is found.
  ops-sec:
    name: ops sec
    if: inputs.run-sec
    runs-on: ${{ inputs.runs-on }}
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false
      - uses: ./.forge/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          compile-cache: none
          working-directory: ${{ inputs.working-directory }}
          tools: ops, trivy
      - name: Move the forge checkout out of the gate
        run: mv .forge "$RUNNER_TEMP/forge"
      - name: ops sec
        working-directory: ${{ inputs.working-directory }}
        run: ops sec
      - name: Restore the forge checkout for setup-rust's post steps
        if: always()
        run: '[ ! -d "$RUNNER_TEMP/forge" ] || mv "$RUNNER_TEMP/forge" .forge'

  # Every other job builds on `toolchain`, so without this nothing checks the
  # `rust-version` a crate declares. `ops msrv` owns the logic (ops's own CI runs it
  # too), so it is not a second copy in shell here.
  msrv:
    name: MSRV
    if: inputs.run-msrv
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out forge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rsvalerio/forge
          ref: ${{ inputs.forge-ref }}
          path: .forge
          persist-credentials: false
      - uses: ./.forge/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          compile-cache: ${{ inputs.use-sccache && 'sccache' || 'rust-cache' }}
          working-directory: ${{ inputs.working-directory }}
          tools: ops
      - name: Keep forge out of the gate
        run: echo '/.forge/' >>.git/info/exclude
      - name: ops msrv --install
        working-directory: ${{ inputs.working-directory }}
        run: ops msrv --install
