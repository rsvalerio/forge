name: Rust CI

# Shared Rust gates, run through ops (docs/consuming.md, "rust-ci"): `ops verify`,
# `ops next` + `ops test-doc`, `ops deps --check` and `ops sec`, so CI runs the commands
# a developer runs, with the flags from the ops Rust stack plus the caller's `.ops.toml`.
# `run-msrv` adds an MSRV job.
#
# Tools come from the caller's own mise.toml, the same file its developers run
# `mise install` against: ops, cargo-nextest, cargo-deny, cargo-machete, trivy, and
# `rust` itself (mise installs it through rustup; without it, the runner's stable
# toolchain is used). Nothing here loads forge's actions or forge's mise.toml, so there
# is no forge checkout and no `forge-ref`.
#
# oxydraw's `frontend` job is deliberately NOT here — it is Bun/SPA-specific and has one
# consumer (see PLAN.md open question 4). It stays in oxydraw's own ci.yml.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing the Cargo workspace. oxydraw uses `backend`. mise reads
          mise.toml from here and every directory above it up to the repository root.
        type: string
        required: false
        default: "."
      runs-on:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest
      env-json:
        description: >-
          JSON object of extra environment variables for the test job, e.g.
          '{"OPS_LOG_LEVEL":"debug"}'.
        type: string
        required: false
        default: "{}"
      run-deny:
        description: Run `ops deps --check` (cargo-deny and cargo-machete).
        type: boolean
        required: false
        default: true
      run-tests:
        description: Run the test job.
        type: boolean
        required: false
        default: true
      run-sec:
        description: >-
          Run `ops sec` (Trivy secret and vulnerability scans), the security leg of the
          gate contract.
        type: boolean
        required: false
        default: true
      run-msrv:
        description: >-
          Check the workspace on its declared minimum Rust version: `ops msrv --install`
          reads `rust-version` from Cargo.toml, fails unless clippy.toml's `msrv` equals
          it, installs that toolchain and runs
          `cargo check --workspace --all-features --all-targets` on it.
        type: boolean
        required: false
        default: false

# The ceiling every consumer runs under, as in the other workflows here. A reusable
# workflow that declares none inherits whatever the caller granted — and a caller that
# declares none in turn inherits the repository default, which is how `dbsec` came to
# run these jobs on a default token. Declared here, the cap holds no matter what the
# caller passes: a called workflow's permissions can only narrow the caller's.
#
# `contents: read` is the whole need: check out, and download release binaries through
# mise (GITHUB_TOKEN only lifts the anonymous rate limit). The mise and target/ caches
# reach the Actions cache through ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN. Nothing here
# writes or takes a secret.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Build against the committed Cargo.lock: ops adds `--locked` to every cargo command
  # that resolves it.
  OPS__CARGO__LOCKED: "true"
  # A CI checkout never recompiles the same crate twice, so incremental output is only
  # weight in the target/ cache.
  CARGO_INCREMENTAL: "0"
  # The caller's mise.toml sits in the checkout it asked us to build; trust it rather
  # than failing on mise's untrusted-config prompt.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_YES: "1"

# Every job: check out, `mise install` the caller's mise.toml (jdx/mise-action caches the
# installs, keyed on the config), cache target/ where the job compiles, then run one leg
# of the gate contract. What each `ops` command runs is the ops Rust stack's default
# unless the caller's `.ops.toml` overrides it, so a repo tunes its CI there, not through
# this workflow's inputs.
#
# jdx/mise-action's `version` pins mise itself; Dependabot moves the SHA but not
# `version`, so bump it with forge's mise.toml and actions/setup-tools (README "Layout").
# Swatinem/rust-cache runs after mise so its key sees the toolchain mise selected.

jobs:
  # The static gate: fmt-check, the whitespace and end-of-file checks, clippy
  # (--all-targets, so test code is linted), build, the JSON/YAML parse checks and doc.
  verify:
    name: ops verify
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          working_directory: ${{ inputs.working-directory }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }}
      # `verify` is check-only from ops 0.77.0; an older ops's `verify` rewrites files and
      # would pass on a dirty tree. The pin is the caller's, so the floor is checked here.
      - name: Require ops 0.77.0 or later
        run: |
          have="$(ops --version | awk '{print $2}')"
          lowest="$(printf '%s\n' 0.77.0 "$have" | sort -V | head -n1)"
          if [ "$lowest" != 0.77.0 ]; then
            echo "::error::rust-ci: ops ${have} rewrites files in 'ops verify'; pin ops >= 0.77.0 in mise.toml."
            exit 1
          fi
      - name: ops verify
        working-directory: ${{ inputs.working-directory }}
        run: ops verify

  # nextest for the tests, `ops test-doc` for the doctests nextest does not run.
  ops-test:
    name: ops test
    if: inputs.run-tests
    runs-on: ${{ inputs.runs-on }}
    env: ${{ fromJSON(inputs.env-json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          working_directory: ${{ inputs.working-directory }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }}
      - name: ops next
        working-directory: ${{ inputs.working-directory }}
        run: ops next
      - name: ops test-doc
        working-directory: ${{ inputs.working-directory }}
        run: ops test-doc

  # cargo-deny (advisories, licenses, bans, sources) and cargo-machete (unused
  # dependencies, a warning only: it is heuristic). `--check` is the CI-safe mode: no
  # upgrade survey, so no cargo-edit. Compiles nothing, so no target/ cache.
  ops-deps:
    name: ops deps
    if: inputs.run-deny
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          working_directory: ${{ inputs.working-directory }}
      - name: ops deps --check
        working-directory: ${{ inputs.working-directory }}
        run: ops deps --check

  # Trivy's secret scan always, and its vulnerability scan wherever a lockfile is found.
  ops-sec:
    name: ops sec
    if: inputs.run-sec
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          working_directory: ${{ inputs.working-directory }}
      - name: ops sec
        working-directory: ${{ inputs.working-directory }}
        run: ops sec

  # Every other job builds on the pinned toolchain, so without this nothing checks the
  # `rust-version` a crate declares. `ops msrv` owns the logic (ops's own CI runs it
  # too), so it is not a second copy in shell here.
  msrv:
    name: MSRV
    if: inputs.run-msrv
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          working_directory: ${{ inputs.working-directory }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }}
      - name: ops msrv --install
        working-directory: ${{ inputs.working-directory }}
        run: ops msrv --install
