# Proposes bumps for the SHA pins README design rule 6 requires. Dependabot resolves the
# new tag to its commit SHA and rewrites the `# vX.Y.Z` comment alongside it, so a bump PR
# still passes `ci/lint.sh pinned-actions`.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows/*.yml; any other directory is scanned for its own
    # action.yml, so the glob picks up every composite action, present and future.
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: weekly
    # Minor and patch bumps: one PR per week for every action, so a bump is reviewed and
    # lands everywhere at once. Majors are left out of the group on purpose, so each one
    # arrives as its own PR: forge's workflows run in every consumer via `@v1`, and a
    # major can change their behaviour (setup-rust-toolchain v2's `build-warnings: deny`
    # default rode in unnoticed alongside patches in #16).
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
