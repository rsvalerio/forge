[backlog]
default_status = "Triage"
statuses = ["Triage", "To Do", "In Progress", "Done"]
zero_padded_ids = 4
task_prefix = "TASK"
backlog_directory = ".backlog"

# `ops verify` is forge's gate, and this file is the only list of its checks: developers,
# wave runners and test-self.yml's lint job all run `ops verify` itself, so a check added
# here runs everywhere and one added anywhere else runs nowhere. Everything in it works
# without network or credentials. Tools come from mise.toml; CI's ops version is pinned
# on test-self.yml's setup-ops step.

# actionlint reports on stdout; ops shows only a failing step's stderr.
[commands.actionlint]
program = "sh"
args = ["-c", "actionlint 1>&2"]
help = "Lint workflows (and every run: block, via shellcheck)"
category = "Code Quality"

[commands.lint-shellcheck]
program = "ci/lint.sh"
args = ["shellcheck"]
help = "shellcheck every standalone script"
category = "Code Quality"

[commands.lint-executable]
program = "ci/lint.sh"
args = ["executable"]
help = "Every script is executable"
category = "Code Quality"

[commands.lint-action-yml]
program = "ci/lint.sh"
args = ["action-yml"]
help = "Every action directory has a well-formed action.yml"
category = "Code Quality"

[commands.lint-config-toml]
program = "ci/lint.sh"
args = ["config-toml"]
help = "Shared configs parse as TOML"
category = "Code Quality"

[commands.lint-pinned-actions]
program = "ci/lint.sh"
args = ["pinned-actions"]
help = "Third-party actions are SHA-pinned with a version comment"
category = "Code Quality"

# The builtin reports the failing file on stdout, which ops hides for a failing step.
[commands.lint-yaml]
program = "sh"
args = ["-c", "ops check-yaml 1>&2"]
help = "Every YAML file parses (templates included)"
category = "Code Quality"

# The pool commit is where a mistake costs most: retention deletes published packages,
# so the pruning rules are tested against a local stand-in for the apt repository.
[commands.test-pool-update]
program = "actions/apt-pool-push/pool-update.test.sh"
help = "apt-pool-push pool logic against a local stand-in repository"
category = "Code Quality"

[commands.verify]
commands = [
  "actionlint",
  "lint-shellcheck",
  "lint-executable",
  "lint-action-yml",
  "lint-config-toml",
  "lint-pinned-actions",
  "lint-yaml",
  "test-pool-update",
]
fail_fast = false
help = "forge's gate: every lint and local shell test (test-self's lint job runs this)"
category = "Code Quality"
