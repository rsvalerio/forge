[backlog]
default_status = "Triage"
statuses = ["Triage", "To Do", "In Progress", "Done"]
zero_padded_ids = 4
task_prefix = "TASK"
backlog_directory = ".backlog"

# forge's two gates follow the contract in docs/foundation.md: `ops verify` is the fast
# static gate (every lint), `ops qa` the full one (the local shell tests). This file is
# the only list of their checks: developers and wave runners run the gates themselves, and
# test-self.yml runs each as its own check (`ops verify`, `ops qa`), so a check added here
# runs everywhere and one added anywhere else runs nowhere. Everything in them works
# without network or credentials. Tools come from mise.toml, ops included: `mise install`
# locally, actions/setup-tools in test-self, both at the same pins.

# actionlint reports on stdout; ops shows only a failing step's stderr.
[commands.actionlint]
program = "sh"
args = ["-c", "actionlint 1>&2"]
help = "Lint workflows (and every run: block, via shellcheck)"
category = "Code Quality"

[commands.lint-shellcheck]
program = "ci/lint.sh"
args = ["shellcheck"]
help = "shellcheck every standalone script"
category = "Code Quality"

[commands.lint-executable]
program = "ci/lint.sh"
args = ["executable"]
help = "Every script is executable"
category = "Code Quality"

[commands.lint-action-yml]
program = "ci/lint.sh"
args = ["action-yml"]
help = "Every action directory has a well-formed action.yml"
category = "Code Quality"

[commands.lint-pinned-actions]
program = "ci/lint.sh"
args = ["pinned-actions"]
help = "Third-party actions are SHA-pinned with a version comment"
category = "Code Quality"

# The builtin reports the failing file on stdout, which ops hides for a failing step.
[commands.lint-yaml]
program = "sh"
args = ["-c", "ops check-yaml 1>&2"]
help = "Every YAML file parses (templates included)"
category = "Code Quality"

# The pool commit is where a mistake costs most: retention deletes published packages,
# so the pruning rules are tested against a local stand-in for the apt repository.
[commands.test-pool-update]
program = "actions/apt-pool-push/pool-update.test.sh"
help = "apt-pool-push pool logic against a local stand-in repository"
category = "Code Quality"

# The major guard is what stops a v2 release carrying `v1` across a major; a regression
# would otherwise only show on a real release. Check-only mode needs no network or token.
[commands.test-move-major-tag]
program = "actions/move-major-tag/move-major-tag.test.sh"
help = "move-major-tag's major guard: below, equal, above and non-numeric majors"
category = "Code Quality"

# `pins: repo` decides which cocogitto a consumer's bump runs; the resolution (nearest
# mise.toml, backend-keyed and table pins, the fall back to forge's) is plain text
# handling, so it is tested without mise or network.
[commands.test-setup-tools]
program = "actions/setup-tools/setup-tools.test.sh"
help = "setup-tools' pin resolution: forge's pins, the repository's, and the fall back"
category = "Code Quality"

[commands.verify]
commands = [
  "actionlint",
  "lint-shellcheck",
  "lint-executable",
  "lint-action-yml",
  "lint-pinned-actions",
  "lint-yaml",
]
fail_fast = false
help = "forge's static gate: every lint (test-self's `ops verify` check runs this)"
category = "Code Quality"

[commands.qa]
commands = [
  "test-pool-update",
  "test-move-major-tag",
  "test-setup-tools",
]
fail_fast = false
help = "forge's full gate: every local shell test (test-self's `ops qa` check runs this)"
category = "Code Quality"
