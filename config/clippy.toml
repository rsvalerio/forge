# Mirror of ops's Rust foundation template: extensions-rust/foundation/templates/clippy.toml
# in rsvalerio/ops. ops is the single source. `ops init --rust` writes this file into a
# repo and `ops init --rust --check` reports drift from it (forge docs/foundation.md).
# This copy exists only for repos that still vendor forge's config/ (dbsec's forge-sync,
# forge TASK-0046), and is deleted once none do (TASK-0048). Change the template in ops,
# then copy its keys here; never edit this side first.
#
# `msrv` is deliberately absent: it differs per repo and belongs next to the `rust-version`
# it must match. `ops init --rust` sets it from the root's `rust-version`.

# 25 is the baseline a repo can adopt without a refactor first. Tighten it locally (with a
# waiver) rather than loosening it here.
cognitive-complexity-threshold = 25

too-many-arguments-threshold = 5
type-complexity-threshold = 250

# Builder and extension patterns legitimately take many lines; this only fires as a lint
# when the corresponding pedantic lint is enabled.
too-many-lines-threshold = 100

# Short binding names that are clearer than any expansion in loops, closures and channels.
allowed-idents-below-min-chars = ["x", "y", "i", "j", "k", "n", "id", "tx", "rx", "db", "ok"]

# Renaming a public item is a breaking change, so clippy should not propose one.
avoid-breaking-exported-api = true

# Panic-adjacent lints are denied in production code but fine in tests. These four keys
# cover exactly `unwrap_used`, `expect_used`, `panic` and `indexing_slicing`; clippy has no
# equivalent key for any other lint.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
