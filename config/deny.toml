# Mirror of ops's Rust foundation template: extensions-rust/foundation/templates/deny.toml
# in rsvalerio/ops. ops is the single source. `ops init --rust` writes this file into a
# repo and `ops init --rust --check` reports drift from it (forge docs/foundation.md).
# This copy exists only for repos that still vendor forge's config/ (dbsec's forge-sync,
# forge TASK-0046), and is deleted once none do (TASK-0048). Change the template in ops,
# then copy its keys here; never edit this side first.
#
# Merged from ops/deny.toml and event0/deny.toml. Deliberately carries NO `advisories.ignore`
# entries: every ignore in the source files was justified by that repo's own dependency tree
# (ops ignored RUSTSEC-2020-0163 for a transitive `rand`; event0 ignored RUSTSEC-2026-0173 for
# `proc-macro-error2` via validator_derive). Those belong in the consuming repo, where the
# justification can be checked against a real Cargo.lock — a shared ignore list silently
# widens every other repo's exposure.
#
# Consumers extend rather than replace: keep a local deny.toml for repo-specific ignores and
# license clarifications, and treat this file as the baseline it should not contradict.

[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[licenses]
# Union of the two source allow-lists. Permissive and weak-copyleft only; anything
# reciprocal (GPL, AGPL) must be an explicit per-repo exception with a written reason.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# No `[[licenses.clarify]]` entries here, for the same reason there are no
# `advisories.ignore` entries: a clarification is a judgement about one crate in one
# dependency tree, and shipping it in the baseline applies that judgement to every
# consumer — including ones that never depended on the crate.
#
# A `ring` clarification lived here until forge-testbed ran `cargo deny` for the first
# time, and the config failed to deserialize outright: cargo-deny 0.20 requires
# `license-files` on a clarify table and the entry had none. Nothing had ever executed it —
# ops carries no clarify block at all. Consumers needing one add it to their own vendored
# copy, where the file hash can be checked against the version actually in their lockfile.

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
