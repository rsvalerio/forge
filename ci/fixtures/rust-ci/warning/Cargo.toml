# test-self fixture for rust-ci.yml: carries one deliberate rustc warning. test-self
# runs it with `clippy-args: ""`, so every job must pass: a warning may fail CI only
# through the caller's `clippy-args`, never through a toolchain-action default such as
# setup-rust-toolchain v2's CARGO_BUILD_WARNINGS=deny. Not published, not part of any
# other workspace.
[package]
name = "forge-fixture-warning"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace root, so cargo never looks further up the tree for one.
[workspace]
