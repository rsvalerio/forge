# What a rust-ci caller's mise.toml looks like: every tool the gates run, at the versions
# CI and developers share (docs/consuming.md, "rust-ci"). Kept at forge's own pins.
[tool_alias]
ops = "github:rsvalerio/ops"
cargo-nextest = "github:nextest-rs/nextest"
cargo-machete = "github:bnjbvr/cargo-machete"

[tools]
rust = { version = "1.98.0", components = "rustfmt,clippy" }
ops = "0.77.0"
cargo-nextest = { version = "0.9.146", version_prefix = "cargo-nextest-" }
cargo-deny = "0.20.2"
cargo-machete = "0.9.2"
trivy = "0.70.0"
