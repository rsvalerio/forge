# What a rust-ci caller's mise.toml looks like: every tool `ops verify` and `ops qa` run
# by default, at the versions CI and developers share (docs/consuming.md, "rust-ci").
# Kept at forge's own pins.
[tool_alias]
ops = "github:rsvalerio/ops"
cargo-machete = "github:bnjbvr/cargo-machete"
cargo-edit = "cargo:cargo-edit"

[tools]
rust = { version = "1.98.0", components = "rustfmt,clippy" }
ops = "0.77.0"
cargo-deny = "0.20.2"
cargo-machete = "0.9.2"
cargo-edit = "0.13.13"
trivy = "0.70.0"
