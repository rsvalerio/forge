# test-self fixture for rust-ci.yml: warning-free, so it must pass every job under the
# default `clippy-args: -D warnings`. Not published, not part of any other workspace.
[package]
name = "forge-fixture-clean"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace root, so cargo never looks further up the tree for one.
[workspace]
